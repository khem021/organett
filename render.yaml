# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy with: connect this repo on render.com → "New Blueprint"

services:
  - type: web
    name: organett
    runtime: docker
    plan: free          # Free plan sleeps after 15 min inactivity; use Starter for always-on
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login

    envVars:
      # ── Application ─────────────────────────────────────────────────────────
      - key: APP_NAME
        value: Organett
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"

      - key: APP_KEY
        generateValue: true

      - key: APP_URL
        fromService:
          type: web
          name: organett
          envVarKey: RENDER_EXTERNAL_URL

      - key: PORT
        value: "8080"

      # ── Database ─────────────────────────────────────────────────────────────
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false     # Neon pooled PostgreSQL connection string; enter it in Render

      # ── Session / Cache / Queue ───────────────────────────────────────────────
      - key: SESSION_DRIVER
        value: database   # sessions table created by migration
      - key: CACHE_STORE
        value: file       # file cache — no extra migration required
      - key: QUEUE_CONNECTION
        value: sync       # synchronous — no worker process required

      # ── Logging ──────────────────────────────────────────────────────────────
      - key: LOG_CHANNEL
        value: stderr     # Render captures stderr as structured logs
      - key: LOG_LEVEL
        value: error

      # ── Misc ─────────────────────────────────────────────────────────────────
      - key: FILESYSTEM_DISK
        value: local
      - key: BCRYPT_ROUNDS
        value: "10"       # Slightly faster hashing on constrained free-tier CPU
